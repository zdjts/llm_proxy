[package]
name = "llm_proxy"
version = "2.0.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync"] }
axum = { version = "0.8", features = ["ws"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter"] }
thiserror = "2"
anyhow = "1"
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio-rustls", "migrate", "derive"] }
rand = "0.8"
uuid = { version = "1", default-features = false, features = ["v4"] }
futures = "0.3"
async-trait = "0.1"
dashmap = "6"
tokio-stream = "0.1"
bytes = "1"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
tower-http = { version = "0.6", features = ["limit", "cors", "fs"] }
clap = { version = "4", features = ["derive"], optional = true }

[dev-dependencies]
tempfile = "3"
mockito = "1"
tower = "0.5"

[features]
default = []
cli = ["clap"]

[[bin]]
name = "llm_proxy"
path = "src/main.rs"

[[bin]]
name = "llm_proxy_cli"
path = "src/cli.rs"
required-features = ["cli"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"
