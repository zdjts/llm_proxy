# llm_proxy v2.0 示例运行配置
# 完整 schema: docs/config-guide.md

server:
  host: "0.0.0.0"
  port: 8080
  max_body_bytes: 1073741824

auth:
  client_keys:
    - { key: "REPLACE_ME_CLIENT_KEY_1", tenant_id: "default" }

db:
  path: "./data/llm_proxy.db"

failover:
  enabled: true
  bad_status_codes: [401, 402, 403, 429]
  probe_interval_secs: 60
  probe_timeout_secs: 10
  max_probe_retries: 3

pools:
  openai_pool:
    keys:
      - { key: "REPLACE_ME_OPENAI_KEY_A", weight: 1 }
      - { key: "REPLACE_ME_OPENAI_KEY_B", weight: 3 }
    strategy: weighted_random
  deepseek_pool:
    keys:
      - { key: "REPLACE_ME_DEEPSEEK_KEY_1", weight: 1 }
  # grok_pool:
  #   keys:
  #     - type: oauth
  #       issuer: xai
  #       key: "ACCESS_TOKEN"
  #       refresh: "REFRESH_TOKEN"
  #       expires: 1700000000000
  #       weight: 1
  #   # Import from pi: llm_proxy_cli oauth import-pi
  #   # Login:         llm_proxy_cli oauth login xai --pool grok_pool --apply

providers:
  - id: openai
    pool_id: openai_pool
    base_url: "https://api.openai.com/v1"
  - id: deepseek
    pool_id: deepseek_pool
    base_url: "https://api.deepseek.com/v1"

# Additional provider kinds (anthropic, gemini) supported
#   - id: anthropic
#     pool_id: anthropic_pool
#     base_url: "https://api.anthropic.com"
#     kind: anthropic

model_to_pool:
  "gpt-4o": openai_pool
  "gpt-4o-mini": openai_pool
  "deepseek-chat": deepseek_pool
  "deepseek-reasoner":
    pool: deepseek_pool
    default_params:
      thinking: { level: "low" }
  # Client alias → rewrite request.model before the upstream call.
  "deepseek-v4-flash":
    pool: deepseek_pool
    upstream_model: deepseek-v4-flash-0731

