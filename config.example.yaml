# llm_proxy 示例运行配置 — 拷贝为 config.yaml 后填入真实值
# 字段语义见 docs/adr-001-architecture.md §4.6；schema 强类型校验在 src/config/mod.rs
# 环境变量覆盖：LLM_PROXY_CONFIG (配置路径)、RUST_LOG (日志级别)

server:
  host: "0.0.0.0"          # 监听地址，内网部署建议 127.0.0.1 / 局域网 IP
  port: 8080
  max_body_bytes: 10485760 # 10 MiB，超过拒绝；按最大 prompt + 图片附件调

auth:
  # 客户端访问网关用的 bearer token，独立于上游厂商 key
  # 生产建议用长随机串，例如 openssl rand -hex 32 产出
  client_keys:
    - { key: "REPLACE_ME_CLIENT_KEY_1", tenant_id: "default" }
    # - { key: "REPLACE_ME_CLIENT_KEY_2", tenant_id: "org-b" }  # 可多个 tenant

db:
  # SQLite 文件路径；目录不存在需提前建（启动会自动建库但不会建目录）
  # 建议放在独立持久卷，开启 WAL 后同目录会出现 -wal / -shm 文件
  path: "./data/llm_proxy.db"

failover:
  enabled: true                  # 关闭则坏 key 不剔除、不探活；池全坏直接 503
  bad_status_codes: [401, 402, 403, 429]  # 命中即剔除当前 key 并重试下一个
  probe_interval_secs: 60         # 坏 key 冷却后下次探活间隔
  probe_timeout_secs: 10          # 单次探活 HTTP 超时
  max_probe_retries: 3            # 连续探活失败次数后放弃再探（需手动重启或 reload）

pools:
  # 每个池子是该厂商的多 key 资源；按 weight 加权随机（见 ADR §4.2 选路算法）
  openai_pool:
    keys:
      - { key: "REPLACE_ME_OPENAI_KEY_A", weight: 1 }
      - { key: "REPLACE_ME_OPENAI_KEY_B", weight: 3 }   # 流量比例 A:B = 1:3
  deepseek_pool:
    keys:
      - { key: "REPLACE_ME_DEEPSEEK_KEY_1", weight: 1 }

providers:
  # OpenAI 兼容厂商；host + key 不同即新条目
  - id: openai
    pool_id: openai_pool
    base_url: "https://api.openai.com/v1"
  - id: deepseek
    pool_id: deepseek_pool
    base_url: "https://api.deepseek.com/v1"
  # 例如新增 Moonshot / Together / 本地 vLLM（均 OpenAI 兼容）：
  # - id: moonshot
  #   pool_id: moonshot_pool
  #   base_url: "https://api.moonshot.cn/v1"

model_to_pool:
  # 显式映射：请求里 client 传哪个 model 走哪个 pool
  # 未命中 → 404 model_not_found
  # 支持两种格式：
  #   简单格式："model": pool_id
  #   完整格式："model": { pool: pool_id, default_params: {...} }
  "gpt-4o": openai_pool
  "gpt-4o-mini": openai_pool
  "deepseek-chat": deepseek_pool
  "deepseek-reasoner":
    pool: deepseek_pool
    default_params:
      thinking: { level: "low" }