# Default values for llm-proxy Helm chart.

replicaCount: 2

image:
  repository: llm-proxy
  tag: v2.0.0
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

resources:
  requests:
    memory: "128Mi"
    cpu: "100m"
  limits:
    memory: "256Mi"
    cpu: "500m"

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

config:
  server:
    host: "0.0.0.0"
    port: 8080
  auth:
    client_keys: []
  db:
    path: "/data/llm_proxy.db"
  failover:
    enabled: true
    bad_status_codes: [401, 402, 403, 429]
  pools: {}
  providers: []
  model_to_pool: {}

redis:
  enabled: false
  url: "redis://llm-proxy-redis:6379"
  prefix: "llm_proxy"

persistence:
  enabled: true
  size: 1Gi

serviceAccount:
  create: true
  name: ""

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8080"
  prometheus.io/path: "/metrics"
