apiVersion: v1
kind: Service
metadata:
  name: llm-proxy-redis
  labels:
    app: llm-proxy-redis
spec:
  ports:
    - port: 6379
      targetPort: 6379
  selector:
    app: llm-proxy-redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-proxy-redis
  labels:
    app: llm-proxy-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llm-proxy-redis
  template:
    metadata:
      labels:
        app: llm-proxy-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
