[flow]
start_node = "planner"
max_steps = 200
agent_retries = 2
route_retries = 2
project_human_intervention = false
snapshot = ".orc/flow_snapshot.json"
logs = ".orc/logs"
tasks_root = ".orc/tasks"

[model]
base_url = "http://127.0.0.1:4000/v1"
model = "gpt-5.6-luna"
timeout_secs = 120
retry_attempts = 2
context_limit = 12000
route_prompt = "prompts/router.md"

[[agents]]
name = "planner"
tool = "pi"
once_prompt = "prompts/planner_once.md"
each_prompt = "prompts/planner_each.md"
args = ["--mode", "json"]
timeout_secs = 900
can_request_human_decision = true

[[agents]]
name = "coder"
tool = "pi"
once_prompt = "prompts/coder_once.md"
each_prompt = "prompts/coder_each.md"
args = ["--mode", "json"]
timeout_secs = 900
can_request_human_decision = true

[[agents]]
name = "reviewer"
tool = "pi"
once_prompt = "prompts/reviewer_once.md"
each_prompt = "prompts/reviewer_each.md"
args = ["--mode", "json"]
timeout_secs = 900
can_request_human_decision = true
