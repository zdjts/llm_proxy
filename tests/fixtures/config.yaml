server:
  host: "0.0.0.0"
  port: 8080
  max_body_bytes: 10485760

auth:
  client_keys:
    - { key: "gw-sk-local-1" }

db:
  path: "./data/test.db"

failover:
  enabled: true
  bad_status_codes: [401, 402, 403, 429]
  probe_interval_secs: 60
  probe_timeout_secs: 10
  max_probe_retries: 3

pools:
  openai_pool:
    keys:
      - { key: "sk-test-aaa", weight: 1 }
      - { key: "sk-test-bbb", weight: 3 }
  deepseek_pool:
    keys:
      - { key: "sk-test-deep-1", weight: 1 }

providers:
  - id: openai
    pool_id: openai_pool
    base_url: "https://api.openai.com/v1"
  - id: deepseek
    pool_id: deepseek_pool
    base_url: "https://api.deepseek.com/v1"

model_to_pool:
  "gpt-4o": openai_pool
  "gpt-4o-mini": openai_pool
  "deepseek-chat": deepseek_pool
  "deepseek-reasoner": deepseek_pool
